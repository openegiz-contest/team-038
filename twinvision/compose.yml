# TwinVision Copper Pit: an overlay on deploy/compose/docker-compose.yml.
# Started by `make twinvision` from the repository root. Relative paths are
# resolved from deploy/compose/ (the project directory), and ${VARS} come
# from deploy/compose/.env, generated by `make up`.

services:
  # Creates or updates every twin in Ditto, then exits.
  twinvision-setup:
    build: ../../twinvision
    image: twinvision/app:local
    restart: "no"
    command: ["python", "-m", "twinvision.setup.setup_twins"]
    environment:
      DITTO_URL: http://ditto-nginx:80
      DITTO_PASSWORD: ${DITTO_PASSWORD}
    depends_on:
      init:
        condition: service_completed_successfully

  # Live + baseline simulation, publishing to MQTT telemetry/<twin>.
  # Same image as twinvision-setup, which builds it (see examples/mine/compose.yml
  # for why only one service may build a given image).
  twinvision-sim:
    image: twinvision/app:local
    pull_policy: never
    restart: unless-stopped
    mem_limit: 256m
    command: ["python", "-m", "twinvision.sim.service"]
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      DITTO_URL: http://ditto-nginx:80
      DITTO_PASSWORD: ${DITTO_PASSWORD}
      SIM_SPEEDUP: ${TWINVISION_SPEEDUP:-20}
      SIM_SEED: ${TWINVISION_SEED:-42}
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(time.time() - os.path.getmtime('/tmp/twinvision-sim.alive') > 30)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    depends_on:
      twinvision-setup:
        condition: service_completed_successfully
      mosquitto:
        condition: service_healthy

  # TwinVision dashboards replace the (empty) platform dashboard folder;
  # they appear in Grafana under Dashboards -> OpenEgiz -> TwinVision.
  grafana:
    volumes:
      - ../../twinvision/grafana/dashboards:/var/lib/grafana/dashboards:ro

  # Live map, what-if controls and live-vs-baseline KPIs: http://localhost:8095
  twinvision-web:
    image: twinvision/app:local
    pull_policy: never
    restart: unless-stopped
    mem_limit: 192m
    command: ["python", "-m", "uvicorn", "twinvision.web.app:app", "--host", "0.0.0.0", "--port", "8000",
              "--no-access-log"]
    environment:
      DITTO_URL: http://ditto-nginx:80
      DITTO_PASSWORD: ${DITTO_PASSWORD}
      INFLUX_URL: http://influxdb:8086
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN}
      GRAFANA_PUBLIC_URL: http://${OPENEGIZ_PUBLIC_HOST:-localhost}:${GRAFANA_PORT:-3000}/d/twinvision-overview
    ports:
      - "${OPENEGIZ_BIND:-127.0.0.1}:${TWINVISION_PORT:-8095}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=4)"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 20s
    depends_on:
      twinvision-setup:
        condition: service_completed_successfully
      ditto-nginx:
        condition: service_healthy
