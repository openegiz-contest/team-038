name: TwinVision clean start

# Follows the README on a fresh Ubuntu 24.04 amd64 runner: clone, ./twinvision.sh up,
# then the TwinVision smoke test, the platform smoke test and the unit tests.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  clean-start:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Host
        run: |
          docker version --format 'Docker {{.Server.Version}}'
          docker compose version
          nproc; free -g; df -h /

      - name: Start (./twinvision.sh up)
        run: |
          start=$(date +%s)
          ./twinvision.sh up
          echo "startup took $(( $(date +%s) - start )) s"

      - name: TwinVision smoke test
        run: ./twinvision.sh smoke

      - name: Platform smoke test
        run: ./twinvision.sh platform-smoke

      - name: Unit tests
        run: ./twinvision.sh test

      - name: Twin inventory
        run: ./twinvision.sh twins

      - name: Resource use
        if: always()
        run: docker stats --no-stream --format 'table {{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}'

      - name: Logs on failure
        if: failure()
        run: ./twinvision.sh ps; docker compose -f deploy/compose/docker-compose.yml -f twinvision/compose.yml logs --tail=80
